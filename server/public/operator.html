<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LiveChat — оператор</title>
<link rel="stylesheet" href="operator.css">
<section id="login"><form id="auth" class="card"><span class="brand">↗ LiveChat</span><h1>Рады видеть вас</h1><p>Войдите, чтобы отвечать посетителям ваших сайтов.</p><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Пароль<input id="password" type="password" autocomplete="current-password" required></label><button>Войти в панель</button></form></section>
<div id="app" hidden><header><span class="brand">↗ LiveChat</span><span id="connection">Подключение…</span><button id="logout">Выйти</button></header><div class="workspace"><aside class="inbox"><h2>Диалоги</h2><input id="search" placeholder="Поиск по сообщениям" aria-label="Поиск"><select id="site" aria-label="Сайт"><option value="">Все сайты</option></select><select id="filter" aria-label="Статус"><option value="all">Все диалоги</option><option value="new">Новые</option><option value="active">Активные</option><option value="closed">Закрытые</option></select><div id="dialogs"></div></aside><main><div id="title">Выберите диалог слева</div><div id="messages" role="log" aria-live="polite"></div><form id="composer" hidden><div><select id="templates" aria-label="Быстрый ответ"><option value="">Вставить быстрый ответ…</option></select><button id="close" type="button">Завершить</button></div><textarea id="body" maxlength="4000" aria-label="Ответ посетителю" placeholder="Напишите ответ…" required></textarea><div><button id="cancel" type="button" hidden>Отменить правку</button><button id="send">Отправить</button></div></form></main><aside class="details"><h2>Посетитель</h2><div id="details">Откройте диалог</div><div id="notes"></div><form id="noteform" hidden><label>Внутренняя заметка<textarea id="note" maxlength="2000" required></textarea></label><button>Сохранить заметку</button></form></aside></div></div><div id="error" role="alert"></div><script type="module" src="operator.js"></script><script type="module" src="operator-shortcuts.js"></script></html>
