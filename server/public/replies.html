<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Быстрые ответы — LiveChat</title><link rel="stylesheet" href="operator.css"><style>.layout{max-width:1100px;margin:24px auto;padding:20px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px}label{display:grid;gap:6px;margin:15px 0}.box{background:white;padding:24px;border-radius:20px}textarea{width:100%;min-height:180px}.item{border:1px solid #dce2ed;border-radius:14px;padding:16px;margin:12px 0}.item p{white-space:pre-wrap;overflow-wrap:anywhere}.muted{color:#64748b;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}a{color:#5145e5}#search{width:100%}#status{white-space:pre-wrap}@media(max-width:700px){.layout{grid-template-columns:1fr}}</style>
<header><span class="brand">↗ LiveChat</span><a href="operator.html">Диалоги</a><a href="settings.html">Сайты</a></header><div class="layout"><section><h1>Быстрые ответы</h1><p>Шаблоны оператора — не стартовые кнопки посетителя.</p><input id="search" aria-label="Поиск шаблонов" placeholder="Название, текст или категория"><label>Область применения<select id="filter"><option value="all">Все шаблоны</option><option value="global">Только общие</option></select></label><button id="new" type="button">Новый шаблон</button><div id="list"></div></section><section class="box"><h2 id="heading">Новый шаблон</h2><form id="editor"><label>Название<input id="title" maxlength="80" required></label><label>Категория<input id="category" maxlength="60" value="Общее" required></label><label>Доступен для<select id="site"><option value="">Всех сайтов</option></select></label><label>Команда, необязательно<input id="shortcut" maxlength="30" placeholder="/hello" pattern="/[A-Za-z0-9_-]+"></label><p class="muted">Команда сохраняется; вызов команды в панели ещё не подключён.</p><label>Текст<textarea id="body" maxlength="2000" required></textarea></label><p class="muted">Подстановки: {visitorName}, {siteName}, {operatorName}. При выборе в диалоге текст сначала вставляется в поле ответа.</p><div class="actions"><button id="save">Сохранить</button><button id="cancel" type="button">Отмена</button></div></form><p id="status" role="status"></p></section></div>
<script type="module">
const $=s=>document.querySelector(s),token=sessionStorage.getItem('livechat-operator');
let items=[],sites=[],editing=null,dirty=false,busy=false;
async function api(path,options={}){const response=await fetch('/api'+path,{...options,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'}});const data=await response.json();if(!response.ok)throw new Error(data.error || 'Ошибка запроса');return data;}
function text(tag,value){const node=document.createElement(tag);node.textContent=value;return node;}
function reset(item=null){editing=item?.id??null;$('#title').value=item?.title??'';$('#category').value=item?.category??'Общее';$('#site').value=item?.siteId??'';$('#shortcut').value=item?.shortcut??'';$('#body').value=item?.body??'';$('#heading').textContent=item?'Редактировать шаблон':'Новый шаблон';dirty=false;$('#status').textContent='';}
function canLeave(){return !dirty||confirm('Отменить несохранённые изменения?');}
function render(){const query=$('#search').value.toLocaleLowerCase('ru-RU'),scope=$('#filter').value;const filtered=items.filter(r=>(scope==='all'||(scope==='global'?!r.siteId:r.siteId===scope))&&[r.title,r.body,r.category,r.shortcut??''].join(' ').toLocaleLowerCase('ru-RU').includes(query));$('#list').replaceChildren();for(const item of filtered){const box=text('article','');box.className='item';const meta=text('div',item.category+' · '+(item.siteId?(sites.find(s=>s.id===item.siteId)?.name??'Сайт недоступен'):'Все сайты')+(item.shortcut?' · '+item.shortcut:''));meta.className='muted';const edit=text('button','Изменить'),remove=text('button','Удалить');edit.type=remove.type='button';edit.disabled=remove.disabled=busy;edit.onclick=()=>{if(canLeave())reset(item);};remove.onclick=async()=>{if(busy||!confirm('Удалить шаблон «'+item.title+'»?'))return;busy=true;render();try{await api('/quick-replies/'+item.id,{method:'DELETE'});items=items.filter(r=>r.id!==item.id);if(editing===item.id)reset();$('#status').textContent='Шаблон удалён.';}catch(error){$('#status').textContent=error.message;}finally{busy=false;render();}};const actions=text('div','');actions.className='actions';actions.append(edit,remove);box.append(text('h3',item.title),meta,text('p',item.body),actions);$('#list').append(box);}if(!filtered.length)$('#list').append(text('p','Шаблоны не найдены.'));}
$('#search').oninput=render;$('#filter').onchange=render;$('#new').onclick=$('#cancel').onclick=()=>{if(!busy&&canLeave())reset();};$('#editor').oninput=()=>dirty=true;
$('#editor').onsubmit=async event=>{event.preventDefault();if(busy)return;busy=true;$('#save').disabled=true;render();$('#status').textContent='Сохраняем…';try{const payload={title:$('#title').value.trim(),category:$('#category').value.trim(),siteId:$('#site').value||null,shortcut:$('#shortcut').value.trim()||null,body:$('#body').value.trim()};const result=await api('/quick-replies'+(editing?'/'+editing:''),{method:editing?'PATCH':'POST',body:JSON.stringify(payload)});const saved=Array.isArray(result)?result[0]:result;items=await api('/quick-replies');reset(saved);$('#status').textContent='Сохранено. Обновите панель оператора и заново откройте диалог, чтобы загрузить шаблоны.';}catch(error){$('#status').textContent=error.message;}finally{busy=false;$('#save').disabled=false;render();}};
window.addEventListener('beforeunload',event=>{if(dirty){event.preventDefault();event.returnValue='';}});
try{if(!token)throw new Error('Сначала войдите в operator.html в этой же вкладке, затем откройте эту страницу.');sites=await api('/sites');for(const site of sites){$('#site').add(new Option(site.name,site.id));$('#filter').add(new Option(site.name,site.id));}items=await api('/quick-replies');render();}catch(error){$('#status').textContent=error.message;$('#save').disabled=true;}
</script></html>
